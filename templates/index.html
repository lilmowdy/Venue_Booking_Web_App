<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPH — Swahili Pot Hub Venue Booking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="badge">SPH</span>
      <div>
        <h1>Swahili Pot Hub Foundation</h1>
        <p>Fast space reservations &amp; availability tracking</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Available Venues</h2>
      <div id="venues-list" class="venues-grid"></div>
    </section>

    <section class="grid-two">
      <form id="booking-form" class="panel">
        <h2>Book a Venue</h2>
        <div id="feedback" class="feedback hidden"></div>

        <label for="venue-select">Venue</label>
        <select id="venue-select" name="venue_id" required></select>

        <label for="event-date">Event Date</label>
        <input id="event-date" name="event_date" type="date" required />

        <label for="client-name">Client / Organizer Name</label>
        <input id="client-name" name="client_name" type="text" placeholder="Amina Hassan" required />

        <label for="client-phone">Phone Number</label>
        <input id="client-phone" name="client_phone" type="tel" placeholder="0712 345 678" required />

        <button type="submit">Confirm Booking</button>
      </form>

      <section class="panel">
        <h2>Scheduled Bookings</h2>
        <div id="bookings-list" class="bookings-list"></div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <strong>SP</strong> &mdash; Sema Pesa &bull; Venue Booking MVP
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
